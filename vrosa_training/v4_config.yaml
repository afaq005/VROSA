# V-ROSA VLM Training Config — V4
# ~48,600 samples | Real-world generalization

model:
  base: llava-hf/llava-1.5-7b-hf
  output_dir: ./weights/vrosa_vlm_v4

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  precision: bfloat16           # A100 native — no grad scaler issues
  batch_size: 2                 # fit in VRAM with 1024 seq length
  grad_accumulation: 16         # effective batch = 32
  sequence_length: 1024         # 576 image tokens + prompt needs >512
  optimizer: adamw_torch        # no bitsandbytes dependency
  lr_schedule: cosine
  num_epochs: 3
  eval_batch_size: 1            # prevents OOM during evaluation
  save_steps: 200
  gradient_checkpointing: true  # required for PEFT + checkpointing

# ── Dataset composition ───────────────────────────────────────
# Total: ~48,600 samples | Train: ~43,700 | Val: ~4,900
data:
  sources:
    - name: isaac_sim_collected
      samples: 3000
      type: real_sim_frames
    - name: robo2vlm_manipvqa
      samples: 8000
      type: real_robot_vqa
    - name: synthetic_nav_real_style
      samples: 6000
      type: gradient_images_da_v2
    - name: metric_distance_training
      samples: 4000
      type: mixed
    - name: command_understanding
      samples: 3000
      type: synthetic
    - name: synthetic_object_id
      samples: 6000
      type: synthetic_warehouse_objects
    - name: multi_object_qa
      samples: 3000
      type: multi_object_scenes
    - name: coco2017
      samples: 8000
      type: real_world_objects_80_categories
    - name: ade20k_scenes
      samples: 5000
      type: scene_types_150
    - name: navigation_cues
      samples: 5000
      type: road_end_corner_door_stairs_intersection
    - name: person_identification
      samples: 3000
      type: person_description_with_distance
  val_split: 0.1

depth_teacher:
  model: depth-anything/Depth-Anything-V2-Small-hf
  scale_prior_meters: 3.0       # median depth → 3m (warehouse prior)
  zones: [left, center, right]  # horizontal thirds
  output_format: natural_language  # "approximately 2.8 meters"
