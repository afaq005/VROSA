# Example: Medical Robot Configuration
# Demonstrates V-ROSA's robot-agnostic design
#
# To use: python vrosa/vrosa_live.py --robot robots/medical_robot.yaml
# Add domain tools in vrosa/agent/tools/medical_tools.py

robot:
  name: "Hospital Service Robot"
  platform: "Generic ROS 2 Mobile Base"

topics:
  camera:    /camera/color/image_raw
  cam_info:  /camera/color/camera_info
  lidar:     /scan/points
  odometry:  /odom
  cmd_vel:   /cmd_vel

ros:
  domain_id: 0
  rmw:       rmw_cyclonedds_cpp

safety:
  safe_distance_m:    1.2    # larger clearance for hospital environment
  caution_distance_m: 2.0
  caution_speed_ratio: 0.3   # extra slow in hospital
  max_speed_ms:        0.3   # slower than warehouse
  max_angular_rad:     0.3

# ── Domain-specific tools to add ──────────────────────────────
